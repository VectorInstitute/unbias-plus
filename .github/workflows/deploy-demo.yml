name: Deploy UnBias Plus

# Trigger on pushes to main that touch relevant files, or manually.
on:
  push:
    branches: [main, deploy,unbias-pretrained]
    paths:
      - 'src/unbias_plus/**'
      - 'Dockerfile'
      - 'Dockerfile.vllm'
      - 'pyproject.toml'
      - '.github/workflows/deploy-demo.yml'
      - '.github/cloudbuild-cache-model.yaml'
  workflow_dispatch:

# Prevent concurrent deployments on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-east4
  GAR_LOCATION: us-east4
  REPOSITORY: unbias-plus
  DEMO_SERVICE: unbias-plus-demo
  VLLM_SERVICE: unbias-plus-vllm
  MODEL_CACHE_BUCKET: unbias-plus-model-cache
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Detect which components changed ────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      demo: ${{ steps.decide.outputs.demo }}
      vllm: ${{ steps.decide.outputs.vllm }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            demo:
              - 'src/unbias_plus/**'
              - 'Dockerfile'
              - 'pyproject.toml'
            vllm:
              - 'Dockerfile.vllm'

      # On workflow_dispatch, treat everything as changed so a full
      # redeploy is triggered regardless of which files differ.
      - name: Resolve what to build
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "demo=true" >> $GITHUB_OUTPUT
            echo "vllm=true"  >> $GITHUB_OUTPUT
          else
            echo "demo=${{ steps.filter.outputs.demo }}" >> $GITHUB_OUTPUT
            echo "vllm=${{ steps.filter.outputs.vllm }}"  >> $GITHUB_OUTPUT
          fi

  # ── Build and push the demo app image ──────────────────────────────────────
  build-demo:
    name: Build Demo Image
    needs: [changes]
    if: needs.changes.outputs.demo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Ensure Artifact Registry repository exists
        run: |
          gcloud artifacts repositories describe ${{ env.REPOSITORY }} \
            --location=${{ env.GAR_LOCATION }} --project=${{ env.PROJECT_ID }} \
            --format="get(name)" 2>/dev/null \
          || gcloud artifacts repositories create ${{ env.REPOSITORY }} \
            --repository-format=docker \
            --location=${{ env.GAR_LOCATION }} \
            --project=${{ env.PROJECT_ID }} \
            --description="Docker images for UnBias Plus" \
            --quiet

      - name: Build and push demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.DEMO_SERVICE }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.DEMO_SERVICE }}:latest
          cache-from: type=gha,scope=demo
          cache-to: type=gha,mode=max,scope=demo

  # ── Build and push the vLLM server image ───────────────────────────────────
  build-vllm:
    name: Build vLLM Image
    needs: [changes]
    if: needs.changes.outputs.vllm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af --volumes

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push vLLM image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.vllm
          push: true
          tags: |
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.VLLM_SERVICE }}:${{ github.sha }}
            ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.VLLM_SERVICE }}:latest
          cache-from: type=gha,scope=vllm
          cache-to: type=gha,mode=max,scope=vllm

  # ── Pre-cache model weights in GCS ─────────────────────────────────────────
  #
  # Runs a Cloud Build job to download the model from HuggingFace and upload
  # the weight blobs + GCS FUSE symlink objects directly — bypassing FUSE so
  # huggingface_hub's append-mode writes never touch the mount.  Skips if large
  # blobs (>100 MB) are already present in the bucket for this model.
  cache-model:
    name: Pre-cache model weights in GCS
    needs: [changes]
    if: needs.changes.outputs.vllm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Extract model ID from Dockerfile.vllm
        id: model
        run: |
          MODEL=$(grep -oP '"vector-institute/[^"]+' Dockerfile.vllm | head -1 | tr -d '"')
          echo "id=$MODEL" >> $GITHUB_OUTPUT
          echo "Model: $MODEL"

      - name: Check if model weights already cached
        id: cache-check
        env:
          MODEL: ${{ steps.model.outputs.id }}
          BUCKET: gs://${{ env.MODEL_CACHE_BUCKET }}
        run: |
          set -euo pipefail
          MODEL_DIR="hub/models--$(echo "${MODEL}" | sed 's|/|--|g')"

          HF_SHA=$(git ls-remote "https://huggingface.co/${MODEL}.git" HEAD | cut -f1)
          CACHED_SHA=$(gsutil cat "${BUCKET}/${MODEL_DIR}/refs/main" 2>/dev/null || echo "")

          echo "hf_sha=${HF_SHA}"         >> "$GITHUB_OUTPUT"
          echo "cached_sha=${CACHED_SHA}" >> "$GITHUB_OUTPUT"

          if [[ -n "${CACHED_SHA}" && "${HF_SHA}" == "${CACHED_SHA}" ]]; then
            echo "Cache is current (sha=${HF_SHA}). Skipping Cloud Build."
            echo "needs_cache=false" >> "$GITHUB_OUTPUT"
          else
            if [[ -z "${CACHED_SHA}" ]]; then
              echo "No cache found — will download from HuggingFace (sha=${HF_SHA})."
            else
              echo "SHA mismatch — cached=${CACHED_SHA}, hf=${HF_SHA}. Clearing stale cache."
              gsutil -m rm -r "${BUCKET}/${MODEL_DIR}/" || true
            fi
            echo "needs_cache=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache model weights via Cloud Build
        if: steps.cache-check.outputs.needs_cache == 'true'
        run: |
          MODEL="${{ steps.model.outputs.id }}"
          gcloud builds submit --no-source \
            --project=${{ env.PROJECT_ID }} \
            --substitutions="_MODEL=${MODEL},_BUCKET=${{ env.MODEL_CACHE_BUCKET }}" \
            --config=.github/cloudbuild-cache-model.yaml

  # ── Deploy vLLM to Cloud Run (GPU) ─────────────────────────────────────────
  #
  # Uses a Cloud Run GPU service (NVIDIA L4) with min-instances=1 (always one
  # warm instance). Model weights are cached in GCS so cold starts load from
  # GCS (~7 min) rather than downloading from HuggingFace every time.
  # vLLM handles concurrency via continuous batching and PagedAttention;
  # containerConcurrency=16 lets each GPU instance absorb burst load before
  # triggering a slow scale-out.
  #
  # Required GCP setup (one-time, already done):
  #   - L4 GPU quota without zonal redundancy in us-east4
  deploy-vllm:
    name: Deploy vLLM (Cloud Run GPU)
    needs: [build-vllm, cache-model]
    if: |
      needs.build-vllm.result == 'success' &&
      (needs.cache-model.result == 'success' || needs.cache-model.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy vLLM to Cloud Run GPU
        id: deploy
        run: |
          # Reconstruct image URL from env — avoids secret-redaction of job outputs.
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.VLLM_SERVICE }}:${{ github.sha }}"

          gcloud run deploy ${{ env.VLLM_SERVICE }} \
            --image="$IMAGE" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --gpu=1 \
            --gpu-type=nvidia-l4 \
            --memory=32Gi \
            --cpu=8 \
            --concurrency=16 \
            --min-instances=1 \
            --max-instances=3 \
            --timeout=3600 \
            --execution-environment=gen2 \
            --no-cpu-throttling \
            --no-gpu-zonal-redundancy \
            --allow-unauthenticated \
            --add-volume=name=hf-cache,type=cloud-storage,bucket=${{ env.MODEL_CACHE_BUCKET }} \
            --add-volume-mount=volume=hf-cache,mount-path=/hf-cache \
            --startup-probe=httpGet.path=/health,initialDelaySeconds=60,failureThreshold=160,periodSeconds=15,timeoutSeconds=5 \
            --set-env-vars="HF_HOME=/hf-cache,VLLM_CACHE_ROOT=/hf-cache/vllm_cache,TOKENIZERS_PARALLELISM=false" \
            --quiet

          URL=$(gcloud run services describe ${{ env.VLLM_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✓ vLLM deployed at $URL"

      - name: Dump vLLM logs on deploy failure
        if: failure()
        run: |
          REV=$(gcloud run revisions list \
            --service=${{ env.VLLM_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --sort-by="~metadata.creationTimestamp" \
            --limit=1 \
            --format='value(metadata.name)')
          echo "Latest revision: ${REV}"
          gcloud logging read \
            "resource.type=cloud_run_revision AND resource.labels.service_name=${{ env.VLLM_SERVICE }} AND resource.labels.revision_name=${REV}" \
            --project=${{ env.PROJECT_ID }} \
            --limit=200 \
            --format='value(textPayload)'

  # ── Deploy demo app to Cloud Run (CPU) ─────────────────────────────────────
  #
  # Lightweight FastAPI app that proxies requests to the vLLM GPU service.
  # Scales to zero when idle — no GPU cost at rest.
  deploy-demo:
    name: Deploy Demo (Cloud Run CPU)
    needs: [build-demo, deploy-vllm]
    if: |
      always() &&
      needs.build-demo.result == 'success' &&
      (needs.deploy-vllm.result == 'success' || needs.deploy-vllm.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@v2


      # If the demo service was previously deployed with GPU (e.g. by mistake),
      # gcloud run deploy inherits resource limits from the existing revision and
      # carries the GPU forward — then fails because cpu=2/memory=2Gi don't meet
      # the GPU minimum (cpu>=4, memory>=16Gi).  Delete the service so it is
      # recreated from scratch without any GPU configuration.
      - name: Clear stale GPU config from demo service
        run: |
          GPU=$(gcloud run services describe ${{ env.DEMO_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(spec.template.spec.containers[0].resources.limits."nvidia.com/gpu")' \
            2>/dev/null || echo "")
          if [ -n "$GPU" ] && [ "$GPU" != "0" ]; then
            echo "Demo service has GPU=$GPU — deleting service to clear GPU config."
            gcloud run services delete ${{ env.DEMO_SERVICE }} \
              --region=${{ env.REGION }} \
              --project=${{ env.PROJECT_ID }} \
              --quiet
          else
            echo "No GPU on demo service — skipping delete."
          fi

      - name: Deploy demo to Cloud Run
        id: deploy
        run: |
          # Reconstruct image URL from env — avoids secret-redaction of job outputs.
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.DEMO_SERVICE }}:${{ github.sha }}"

          gcloud run deploy ${{ env.DEMO_SERVICE }} \
            --image="$IMAGE" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --memory=2Gi \
            --cpu=2 \
            --concurrency=80 \
            --min-instances=1 \
            --max-instances=10 \
            --timeout=900 \
            --no-cpu-throttling \
            --allow-unauthenticated \
            --set-env-vars="VLLM_BASE_URL=https://proxy.vectorinstitute.ai/v1,VLLM_MODEL_NAME=unbias-plus,MAX_INPUT_CHARS=5000,TOKENIZERS_PARALLELISM=false" \
            --set-secrets="VLLM_API_KEY=vllm-proxy-api-key:latest" \
            --quiet

          URL=$(gcloud run services describe ${{ env.DEMO_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✓ Demo deployed at $URL"

      - name: Health check
        run: |
          URL="${{ steps.deploy.outputs.url }}/health"
          echo "Checking $URL..."
          for i in $(seq 1 20); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL" 2>/dev/null)
            if [ "$HTTP" = "200" ]; then
              echo "✓ Health check passed"
              curl -s "$URL" | python3 -m json.tool || true
              exit 0
            fi
            echo "  Attempt $i/20 — HTTP $HTTP, retrying..."
            sleep 5
          done
          echo "✗ Demo health check failed"
          exit 1

      - name: Deployment summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## UnBias Plus — Deployment Summary

          **Commit:** `${{ github.sha }}`
          **Branch:** `${{ github.ref_name }}`
          **Triggered by:** @${{ github.actor }}

          ### Services
          | Service | URL | Notes |
          |---------|-----|-------|
          | **Demo UI** | ${{ steps.deploy.outputs.url }} | Cloud Run CPU, scales to zero |
          | **vLLM API** | https://proxy.vectorinstitute.ai/v1 | Routed via Vector proxy gateway |
          | **Health** | ${{ steps.deploy.outputs.url }}/health | |
          | **Model** | vector-institute/Qwen3-8B-UnBias-Plus-SFT-Instruct-Legacy | served via vLLM |

          ---
          *Deployed at $(date -u +"%Y-%m-%d %H:%M:%S UTC")*
          EOF
