name: code checks
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
      - unbias-pretrained
  pull_request:
    branches:
      - main
      - unbias-pretrained

jobs:
  run-code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@v7.5.0
        with:
          # Install a specific version of uv.
          version: "0.10.12"
          enable-cache: true

      - name: "Set up Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version-file: ".python-version"
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install the project
        run: uv sync --group dev --no-extra train

      - name: Install dependencies and check code
        run: |
          source .venv/bin/activate
          pre-commit run --all-files

      - name: pip-audit (gh-action-pip-audit)
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          virtual-environment: .venv/
          ignore-vulns: |
            GHSA-4xh5-x5gv-qwph
            PYSEC-2024-161
            CVE-2026-1839
            CVE-2026-3219
            CVE-2026-6357
            # markdown PYSEC-2026-89: advisory documents 3.8.1 as the fix, but
            # OSV affected-range data still flags 3.8.1+. We're pinned to 3.8.1.
            PYSEC-2026-89
            # transformers PYSEC-2025-211..218: checkpoint-conversion / model-load
            # RCEs. No fix version published in OSV — flagged on every release.
            # Exploitation requires loading attacker-controlled checkpoints; we
            # don't ingest untrusted checkpoints in the API or demo paths.
            PYSEC-2025-211
            PYSEC-2025-212
            PYSEC-2025-213
            PYSEC-2025-214
            PYSEC-2025-215
            PYSEC-2025-216
            PYSEC-2025-217
            PYSEC-2025-218
