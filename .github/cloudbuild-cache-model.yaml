# Cloud Build config for pre-caching HuggingFace model weights in GCS.
#
# Downloads the model to local disk (bypassing GCS FUSE) and uploads the
# blob files + GCS FUSE symlink objects directly to the cache bucket.
# This avoids huggingface_hub's append-mode writes, which GCS FUSE does
# not support.
#
# Required substitutions:
#   _MODEL  — HuggingFace model ID (e.g. vector-institute/Qwen3-8B-UnBias-Plus-SFT-Instruct)
#   _BUCKET — GCS bucket name (e.g. unbias-plus-model-cache)
#
# No auth: authenticated downloads were found to hang indefinitely inside
# Cloud Build's network specifically (reproduced 3x; the same token worked
# fine locally every time), so this deliberately stays anonymous. The
# original failure mode this guarded against was a transient CDN error on
# one shard a few hours after the model was pushed to HF — snapshot_download
# resumes from cache_dir, so retrying a few times clears that without auth.

steps:
- name: 'python:3.11-slim'
  id: 'download'
  entrypoint: bash
  env:
  - '_MODEL=${_MODEL}'
  - 'HF_HUB_ETAG_TIMEOUT=30'
  - 'HF_HUB_DOWNLOAD_TIMEOUT=30'
  timeout: '900s'
  args:
  - -c
  - |
    set -x
    pip install -q "huggingface_hub>=0.23"
    ok=0
    for attempt in 1 2 3 4 5; do
      python3 -c "
    import socket; socket.setdefaulttimeout(30)
    from huggingface_hub import snapshot_download; import os
    model = os.environ['_MODEL']
    print(f'Downloading {model} (attempt ${attempt}) ...')
    snapshot_download(model, cache_dir='/workspace/hf-cache')
    print('Download complete.')
    " && { ok=1; break; }
      echo "attempt ${attempt} failed, retrying in 15s..."
      sleep 15
    done
    [ "$ok" -eq 1 ]

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
  id: 'upload'
  entrypoint: bash
  args:
  - -c
  - |
    set -euo pipefail
    # Use lowercase variable names — Cloud Build substitutes any all-caps brace patterns.
    # snapshot_download(cache_dir=X) puts files at X/models--...  (no hub/ subdir).
    # GCS must use hub/models--... to match HF_HOME=/hf-cache on Cloud Run.
    model_slug="models--$(echo '${_MODEL}' | sed 's|/|--|g')"
    local_dir="/workspace/hf-cache/${model_slug}"
    dest="gs://${_BUCKET}/hub/${model_slug}"

    echo "=== Uploading blobs ==="
    gsutil -m cp "${local_dir}/blobs/"* "${dest}/blobs/"

    # Recreate snapshot symlinks as GCS FUSE symlink objects (0-byte with
    # gcsfuse_symlink_target metadata), matching the structure GCS FUSE expects.
    echo "=== Writing snapshot symlinks ==="
    for snap_dir in "${local_dir}/snapshots"/*/; do
      commit=$(basename "${snap_dir}")
      for f in "${snap_dir}"*; do
        [ -e "${f}" ] || continue
        fname=$(basename "${f}")
        if [ -L "${f}" ]; then
          target=$(readlink "${f}")
          echo "  ${fname} -> ${target}"
          echo -n | gsutil \
            -h "Content-Type:text/plain; charset=utf-8" \
            -h "x-goog-meta-gcsfuse_symlink_target:${target}" \
            cp - "${dest}/snapshots/${commit}/${fname}"
        fi
      done
    done

    echo "=== Uploading refs ==="
    gsutil -m cp "${local_dir}/refs/"* "${dest}/refs/"

    echo "=== Done ==="
    gsutil du -sh "${dest}/"

timeout: '3600s'
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: '60'
  logging: CLOUD_LOGGING_ONLY
