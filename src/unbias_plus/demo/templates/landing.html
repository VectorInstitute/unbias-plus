<!DOCTYPE html>
<html lang="en" class="landing-root">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UnBias+ | Vector Institute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />

<body class="login-page landing-page">
  <div class="noise"></div>

  <header>

      </div>
      <span class="logo-tagline">Detect and neutralize bias in text</span>

    <div class="header-auth">
      <img
        src="/static/Vector-Logo-FullColour_Horizontal.png"
        alt="Vector Institute"
        class="vector-logo"
      />
      <a class="landing-cta-outline" href="/login">Sign In</a>

  <main class="login-main">
    <div class="landing-hero">
      <h1 class="landing-headline">Detect and Neutralize Bias in Text</h1>

      <div class="landing-actions">

          <a

          </a>
        </div>
        <div class="landing-actions-links">
          <a
            class="landing-inline-link"
            href="https://vectorinstitute.github.io/unbias-plus/"

            rel="noopener noreferrer"

            Docs
          </a>
          <span class="landing-inline-sep" aria-hidden="true">·</span>
          <a
            class="landing-inline-link"
            href="https://github.com/VectorInstitute/unbias-plus"
            target="_blank"
            rel="noopener noreferrer"
          >
            GitHub
          </a>
        </div>
      </div>
    </div>
