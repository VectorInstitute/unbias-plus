<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — UnBias+ | Vector Institute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,300;1,400&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- window.__UNBIAS_CONFIG__ injected here by /login route -->
</head>
<body class="login-page">
  <div class="noise"></div>

  <!-- HEADER -->
  <header>
    <div class="header-left">
      <div class="logo">
        <span class="logo-un">Un</span><span class="logo-bias">Bias</span><span class="logo-plus"> Plus</span>
      </div>
      <span class="logo-tagline">Detect and neutralize bias in text</span>
    </div>
    <img
      src="/static/Vector-Logo-FullColour_Horizontal.png"
      alt="Vector Institute"
      class="vector-logo"
    />
  </header>

  <!-- MAIN CONTENT -->
  <main class="login-main">
    <div class="login-card">
      <p class="login-card-title">Welcome to UnBias+</p>
      <p class="login-card-sub">Sign in or create an account to get started.</p>

      <!-- ERROR BANNER -->
      <div class="auth-error hidden" id="auth-error"></div>

      <!-- TABS -->
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-signin" type="button">Sign In</button>
        <button class="auth-tab" id="tab-signup" type="button">Sign Up</button>
      </div>

      <!-- SIGN IN FORM -->
      <form id="signin-form" autocomplete="on">
        <div class="auth-field">
          <label class="auth-label" for="signin-email">Email</label>
          <input
            class="auth-input"
            id="signin-email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="signin-password">Password</label>
          <div class="auth-input-wrap">
            <input
              class="auth-input password-input"
              id="signin-password"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button type="button" class="password-toggle" id="signin-pwd-toggle" aria-label="Toggle password visibility">
              <svg id="signin-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="auth-submit-btn" id="signin-btn" type="submit">
          <span class="btn-text">Sign In</span>
          <span class="btn-arrow">→</span>
        </button>
        <div class="auth-ack hidden" id="signin-ack"></div>
      </form>

      <!-- SIGN UP FORM -->
      <form id="signup-form" class="hidden" autocomplete="on">
        <div class="auth-field">
          <label class="auth-label" for="signup-email">Email</label>
          <input
            class="auth-input"
            id="signup-email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="auth-field">
          <label class="auth-label" for="signup-password">Password</label>
          <div class="auth-input-wrap">
            <input
              class="auth-input password-input"
              id="signup-password"
              type="password"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            />
            <button type="button" class="password-toggle" id="signup-pwd-toggle" aria-label="Toggle password visibility">
              <svg id="signup-eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="auth-submit-btn" id="signup-btn" type="submit">
          <span class="btn-text">Create Account</span>
          <span class="btn-arrow">→</span>
        </button>
        <div class="auth-ack hidden" id="signup-ack"></div>
      </form>
    </div>
  </main>

  <script>
    (function () {
      const cfg = window.__UNBIAS_CONFIG__ || {};
      const SUPA_URL = cfg.supabaseUrl || "";
      const SUPA_KEY = cfg.supabaseAnonKey || "";

      if (!SUPA_URL || !SUPA_KEY) {
        console.warn("UnBias+: Supabase config missing — login page will not work.");
      }

      const client = (SUPA_URL && SUPA_KEY)
        ? window.supabase.createClient(SUPA_URL, SUPA_KEY)
        : null;

      // ── Redirect if already logged in ───────────────────────
      if (client) {
        client.auth.getSession().then(({ data }) => {
          if (data?.session) window.location.href = "/app";
        });
      }

      // ── DOM refs ─────────────────────────────────────────────
      const tabSignin  = document.getElementById("tab-signin");
      const tabSignup  = document.getElementById("tab-signup");
      const formSignin = document.getElementById("signin-form");
      const formSignup = document.getElementById("signup-form");
      const authError  = document.getElementById("auth-error");
      const signinAck  = document.getElementById("signin-ack");
      const signupAck  = document.getElementById("signup-ack");

      // ── Tab switching ────────────────────────────────────────
      function activateTab(tab) {
        tabSignin.classList.toggle("active", tab === "signin");
        tabSignup.classList.toggle("active", tab === "signup");
        formSignin.classList.toggle("hidden", tab !== "signin");
        formSignup.classList.toggle("hidden", tab !== "signup");
        hideError();
      }

      tabSignin.addEventListener("click", () => activateTab("signin"));
      tabSignup.addEventListener("click", () => activateTab("signup"));

      // ── Error helpers ────────────────────────────────────────
      function showError(msg) {
        authError.textContent = msg;
        authError.classList.remove("hidden");
      }

      function hideError() {
        authError.classList.add("hidden");
        authError.textContent = "";
      }

      // ── Password toggles ─────────────────────────────────────
      function makeEyeIcon(visible) {
        if (visible) {
          return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>`;
        }
        return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>`;
      }

      function setupToggle(toggleId, inputId) {
        const toggle = document.getElementById(toggleId);
        const input  = document.getElementById(inputId);
        if (!toggle || !input) return;
        toggle.addEventListener("click", () => {
          const isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";
          toggle.innerHTML = makeEyeIcon(isPassword);
        });
      }

      setupToggle("signin-pwd-toggle", "signin-password");
      setupToggle("signup-pwd-toggle", "signup-password");

      // ── Sign In ──────────────────────────────────────────────
      formSignin.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!client) { showError("Auth not configured."); return; }

        hideError();
        const btn = document.getElementById("signin-btn");
        const email    = document.getElementById("signin-email").value.trim();
        const password = document.getElementById("signin-password").value;

        btn.disabled = true;
        btn.querySelector(".btn-text").textContent = "Signing in…";

        const { error } = await client.auth.signInWithPassword({ email, password });

        if (error) {
          showError(error.message);
          btn.disabled = false;
          btn.querySelector(".btn-text").textContent = "Sign In";
          return;
        }

        signinAck.textContent = "Welcome back — let\u2019s get to work.";
        signinAck.classList.remove("hidden");
        setTimeout(() => { window.location.href = "/app"; }, 1200);
      });

      // ── Sign Up ──────────────────────────────────────────────
      formSignup.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!client) { showError("Auth not configured."); return; }

        hideError();
        const btn = document.getElementById("signup-btn");
        const email    = document.getElementById("signup-email").value.trim();
        const password = document.getElementById("signup-password").value;

        btn.disabled = true;
        btn.querySelector(".btn-text").textContent = "Creating account…";

        const { data, error } = await client.auth.signUp({ email, password });

        if (error) {
          showError(error.message);
          btn.disabled = false;
          btn.querySelector(".btn-text").textContent = "Create Account";
          return;
        }

        if (data.session) {
          signupAck.textContent = "Welcome to UnBias+ \u2014 your account is ready.";
          signupAck.classList.remove("hidden");
          setTimeout(() => { window.location.href = "/app"; }, 1200);
        } else {
          signupAck.textContent = "Check your inbox to confirm your email before signing in.";
          signupAck.classList.remove("hidden");
          btn.disabled = false;
          btn.querySelector(".btn-text").textContent = "Create Account";
        }
      });
    })();
  </script>
</body>
</html>
