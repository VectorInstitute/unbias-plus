<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starting up — UnBias+ | Vector Institute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:   #EB088A;
      --text:     #000000;
      --text-2:   #3c3c3c;
      --text-3:   #9a9a9a;
      --border:   #e4e4e0;
      --bg:       #ffffff;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Open Sans', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Subtle noise texture */
    .noise {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      opacity: 0.018;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    /* Header */
    header {
      padding: 24px 64px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
    }
    .logo-un   { color: var(--text); }
    .logo-bias { color: var(--accent); }
    .logo-plus { color: var(--text-2); font-weight: 400; }

    .logo-tagline {
      font-size: 13px;
      color: var(--text-3);
      font-weight: 300;
    }

    .vector-logo {
      height: 64px;
      width: auto;
      opacity: 0.9;
    }

    /* Main area */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
    }

    /* Loading card */
    .loading-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      max-width: 340px;
      width: 100%;
    }

    .loading-text {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Spinner */
    .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(235, 8, 138, 0.14);
      border-top-color: var(--accent);
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Text */
    .loading-title {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.4px;
      color: var(--text);
      line-height: 1.2;
    }

    .loading-sub {
      font-size: 13px;
      color: var(--text-3);
      font-weight: 300;
      line-height: 1.6;
    }

    /* Status line */
    .loading-status {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 1.4s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* Responsive */
    @media (max-width: 640px) {
      header { padding: 20px 24px; }
      .vector-logo { height: 44px; }
      .logo { font-size: 24px; }
    }
  </style>
</head>
<body>
  <div class="noise"></div>

  <header>
    <div class="header-left">
      <div class="logo">
        <span class="logo-un">Un</span><span class="logo-bias">Bias</span><span class="logo-plus"> Plus</span>
      </div>
      <span class="logo-tagline">Detect and neutralize bias in text</span>
    </div>
    <img
      src="/static/Vector-Logo-FullColour_Horizontal.png"
      alt="Vector Institute"
      class="vector-logo"
    />
  </header>

  <main>
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-text">
        <p class="loading-title">Warming up</p>
        <p class="loading-sub">The server is starting — this takes a few seconds.</p>
      </div>
      <div class="loading-status">
        <span class="status-dot"></span>
        <span id="status-text">Connecting…</span>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const statusEl = document.getElementById("status-text");
      let attempts = 0;

      async function checkReady() {
        attempts++;
        if (attempts > 1) {
          statusEl.textContent = "Checking… (attempt " + attempts + ")";
        }
        try {
          const res = await fetch("/health", { cache: "no-store" });
          if (res.ok) {
            statusEl.textContent = "Ready — redirecting…";
            window.location.href = "/login";
            return;
          }
        } catch (_) {}
        setTimeout(checkReady, 3000);
      }

      // First check after 2 s — gives the container a moment to bind its port.
      setTimeout(checkReady, 2000);
    })();
  </script>
</body>
</html>
