# Bias-weighted SFT (recommended default): the balanced middle ground.
# Milder base weights than phrase_unlikelihood, but per-bias-type multipliers
# concentrate pressure on stereotype/generalization/dehumanizing rewrites while
# easing off opinion/sensational/loaded. A mild phrase penalty removes only
# explicit laundering continuations. Preserves neutral content and length.
name: bias_weighted
description: >-
  Per-bias-type weighted SFT + mild phrase anti-laundering penalty + partial
  (0.5x) hard-case upsampling. Concise balanced prompt. The recommended default.
prompt: concise_balanced

base_model: unsloth/Qwen3-8B
max_seq_length: 8192
train_samples: 5000
seed: 42
heldout_size: 250
eval_size: 250

lora:
  r: 16
  alpha: 32
  dropout: 0.0

optim:
  learning_rate: 7.0e-5
  epochs: 5
  per_device_batch: 1
  grad_accum: 16
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler: cosine
  max_grad_norm: 1.0

weights:
  base_completion: 1.0
  original: 0.40
  replacement: 2.75
  reasoning: 1.60
  unbiased_text: 1.40

bias_type_weighting:
  max_replacement: 3.90
  max_reasoning: 2.10
  max_unbiased_text: 1.75
  field_multipliers:
    dehumanizing_language: {replacement: 1.25, reasoning: 1.15}
    stereotypical_association: {replacement: 1.35, reasoning: 1.25}
    unsupported_generalization: {replacement: 1.15, reasoning: 1.10}
    euphemism: {replacement: 1.00, reasoning: 1.00}
    informational_bias: {replacement: 0.95, reasoning: 0.95}
    loaded_language: {replacement: 0.95, reasoning: 0.95}
    opinion_as_fact: {replacement: 0.90, reasoning: 0.90}
    sensationalism: {replacement: 0.95, reasoning: 0.95}
  rewrite_multipliers:
    dehumanizing_language: 1.15
    stereotypical_association: 1.18
    unsupported_generalization: 1.10
    euphemism: 1.00
    informational_bias: 1.00
    loaded_language: 0.98
    opinion_as_fact: 0.98
    sensationalism: 0.98

phrase_unlikelihood:
  lambda_weight: 0.025
  max_ids_per_pos: 6
  phrases:
    - "Some people believe"
    - "some people believe"
    - "Some people think"
    - "some people think"
    - "Some people claim"
    - "some people claim"
    - "some women may"
    - "Some women may"
    - "women may"
    - "Women may"
    - "some men may"
    - "Some men may"
    - "men may"
    - "Men may"
    - "some team members may"
    - "Some team members may"
    - "some employees may"
    - "Some employees may"
    - "some candidates may"
    - "Some candidates may"
    - "men are commonly associated"
    - "women are commonly associated"
    - "commonly associated with"
    - "seen as"
    - "perceived as"
    - "concerns about whether"
    - "have concerns about whether"
    - "some companies may"
    - "Some companies may"
    - "some companies assign"
    - "Some companies assign"
    - "companies may assign"
    - "companies may prefer"

data:
  hard_upsample_extra_fraction: 0.50
  soft_debias_bias_types:
    - stereotypical_association
    - unsupported_generalization

wandb:
  enabled: true
  project: unbias-sft-bias-weighted
  run_name: qwen3-8b-sft-bias-weighted
