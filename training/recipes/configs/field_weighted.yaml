# Field-weighted SFT: upweight the tokens where debiasing behavior lives
# (replacement, reasoning, unbiased_text) and downweight copied `original` spans
# so the objective stops being dominated by copy/JSON-syntax tokens.
name: field_weighted
description: >-
  Token-weighted cross-entropy that emphasizes replacement/reasoning/rewrite
  fields over copied spans. Rewrite-editor prompt prioritizing residual-bias
  removal over length.
prompt: rewrite_editor

base_model: unsloth/Qwen3-8B
max_seq_length: 8192
train_samples: 5000
seed: 42
heldout_size: 250
eval_size: 250

lora:
  r: 16
  alpha: 32
  dropout: 0.0

optim:
  learning_rate: 8.0e-5
  epochs: 5
  per_device_batch: 1
  grad_accum: 16
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler: cosine
  max_grad_norm: 1.0

weights:
  base_completion: 1.0
  original: 0.35
  replacement: 6.0
  reasoning: 3.0
  unbiased_text: 2.25

data: {}

wandb:
  enabled: true
  project: unbias-sft-field-weighted
  run_name: qwen3-8b-sft-field-weighted
