# Baseline SFT: plain completion-only cross-entropy on the train_4 schema.
# All field weights are 1.0, which reproduces standard completion-only loss
# through the shared weighted trainer. Long, cautious annotator prompt.
name: baseline
description: >-
  Completion-only SFT with uniform token loss and the conservative annotator
  prompt. The reference point every other recipe is compared against.
prompt: conservative

base_model: unsloth/Qwen3-8B
max_seq_length: 8192
train_samples: 5000
seed: 42
heldout_size: 250
eval_size: 250

lora:
  r: 16
  alpha: 32
  dropout: 0.0

optim:
  learning_rate: 1.0e-4
  epochs: 5
  per_device_batch: 2
  grad_accum: 8
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler: cosine
  max_grad_norm: 1.0

weights:
  base_completion: 1.0
  original: 1.0
  replacement: 1.0
  reasoning: 1.0
  unbiased_text: 1.0

data: {}

wandb:
  enabled: true
  project: unbias-sft-baseline
  run_name: qwen3-8b-sft-baseline
